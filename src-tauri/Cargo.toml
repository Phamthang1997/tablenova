[package]
name = "tablenova"
version = "0.1.1"
edition = "2024"

[dependencies]
tauri = { version = "2.11.5", features = ["macos-private-api"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
window-vibrancy = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "mysql",
] }
# Bật feature kiểu dữ liệu trực tiếp trên driver Postgres/MySQL để KHÔNG kéo theo sqlx-sqlite
# (sqlx-sqlite xung đột libsqlite3-sys với rusqlite). Nhờ đó decode được date/numeric/json/uuid.
sqlx-postgres = { version = "0.9.0", default-features = false, features = [
    "chrono",
    "bigdecimal",
    "uuid",
    "json",
] }
sqlx-mysql = { version = "0.9.0", default-features = false, features = [
    "chrono",
    "bigdecimal",
    "uuid",
    "json",
] }
bigdecimal = "0.4"
# `v4` cho `Uuid::new_v4()`: conn_id do backend sinh (multi-connection-plan §4.3 — opaque, không
# dẫn xuất từ config vì config mang secret). sqlx chỉ cần uuid để decode nên không bật feature này.
uuid = { version = "1", features = ["v4"] }
russh = "0.62.5"
portable-pty = "0.9"
flate2 = "1.1.9"
zip = "8.6.0"
tokio = { version = "1.53.1", features = ["full"] }
futures-util = "0.3"
thiserror = "2.0.20"
chrono = "0.4.45"
regex = "1.13.1"
hmac = "0.13"
sha2 = "0.11"
# `tls-rustls-insecure` is what makes the REQUIRED and VERIFY_CA modes of the Redis SSL tab
# possible: without it redis-rs refuses both `#insecure` and `danger_accept_invalid_hostnames`
# at connect time. VERIFY_CA is also the only usable mode when Redis is reached over an SSH
# tunnel, because the certificate is then presented for 127.0.0.1.
redis = { version = "1.5.0", features = ["tokio-comp", "tokio-rustls-comp", "tls-rustls-insecure"] }
# Payload DUMP của Redis là byte thô. Xuất/nhập keyspace ghi nó vào tệp NDJSON, nên cần base64:
# mảng số như `redis_get_key` dùng cho `bytes` thì gấp ~3 lần kích thước và không ghi được ra tệp
# text. Bản 0.22 đã có trong Cargo.lock từ trước (dependency gián tiếp) nên không thêm gì mới vào
# cây phụ thuộc.
base64 = "0.23.1"
# Kho bí mật của HĐH (Windows Credential Manager / Keychain / Secret Service).
# Tắt default-features rồi bật đúng backend theo từng nền tảng bên dưới, tránh kéo
# zbus + secret-service vào bản build Windows.
keyring = { version = "4.1.6", default-features = false, features = ["v1"] }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "4.1.6", features = ["windows-native-keyring-store"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4.1.6", features = ["apple-native-keyring-store"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "4.1.6", features = ["zbus-secret-service-keyring-store"] }

# Release-only tuning: `tauri build` (the installable app) uses this profile, while
# `tauri dev` uses [profile.dev] and writes to a different target dir, so a running
# dev session is unaffected. Cost is a full recompile on the first build afterwards.
#
# `panic` and `overflow-checks` are deliberately left at their defaults: `panic = "abort"`
# would turn a panic inside a single command into a crash of the whole app (losing the
# open connection and every unsaved SQL draft), and release already implies
# `overflow-checks = false`, so spelling it out changes nothing.
[profile.release]
lto = "fat"          # whole-program LTO; pairs with codegen-units = 1
codegen-units = 1    # one unit lets LLVM optimize across the whole crate graph
strip = true         # drop symbol names (release carries no debuginfo already)
