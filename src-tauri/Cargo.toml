[package]
name = "tablenova"
version = "0.1.0"
edition = "2024"

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
rusqlite = { version = "0.40.1", features = ["bundled"] }
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "mysql",
] }
# Bật feature kiểu dữ liệu trực tiếp trên driver Postgres/MySQL để KHÔNG kéo theo sqlx-sqlite
# (sqlx-sqlite xung đột libsqlite3-sys với rusqlite). Nhờ đó decode được date/numeric/json/uuid.
sqlx-postgres = { version = "0.9.0", default-features = false, features = ["chrono", "bigdecimal", "uuid", "json"] }
sqlx-mysql = { version = "0.9.0", default-features = false, features = ["chrono", "bigdecimal", "uuid", "json"] }
bigdecimal = "0.4"
uuid = "1"
russh = "0.62.2"
portable-pty = "0.8"
flate2 = "1.0.35"
zip = "8.6.0"
tokio = { version = "1.52.3", features = ["full"] }
futures-util = "0.3"
thiserror = "2.0.11"
chrono = "0.4.45"
regex = "1.13.0"
hmac = "0.12"
sha2 = "0.10"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
